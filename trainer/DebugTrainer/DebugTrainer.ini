; DebugTrainer settings. Edit with the game closed, or use "Save settings" in the menu.
[Trainer]
; Key that opens and closes the menu: F1..F12, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, TILDE,
; or a virtual-key code such as 0x70.
MenuKey=F1
; 1 = the game never sees the menu key (F1 is bound to the pad SELECT button in PC\NUCONFIG.TXT).
BlockMenuKeyInGame=1
; 1 = the game ignores keyboard and mouse while the menu is open.
BlockGameInputWhileOpen=1
; 1 = open the menu as soon as the game starts.
StartOpen=0
; 1 = show "Debug Trainer ready" in the corner for 8 seconds after start.
ShowStartupNote=1
; Menu text size.
FontScale=1.25
; Menu cursor speed (the menu draws its own cursor; the game keeps the Windows one hidden).
MouseSpeed=1.0

[Noclip]
; Key that toggles noclip (also changeable in the menu: Noclip -> Change key).
Key=N
; Units per second, and the multiplier while Shift is held.
Speed=25.0
FastMultiplier=3.0
