; VoiceMenu settings. Edit with the game closed.
; Keys: a letter or digit, F1..F12, TAB, BACKSPACE, [, ], MINUS, PLUS, COMMA, PERIOD, INSERT, DELETE, HOME, END,
; PAGEUP, PAGEDOWN, TILDE, NUMPAD0, OFF, or a virtual-key code such as 0x56.
; The defaults are keys the game doesn't use (PC\NUCONFIG.TXT).
[VoiceMenu]
; Opens and closes the menu.
MenuKey=V
; Plays a random line of your character without opening the menu. OFF to disable.
RandomKey=B
; While the menu is open: 1-9 play the lines on the page, 0 or StopKey stops.
StopKey=BACKSPACE
PrevPageKey=[
NextPageKey=]
; Switches the list: your character -> each other speaker -> back to your character.
SwitchListKey=TAB
; Voice volume in percent (0-200).
Volume=100
; 1 = only the dramatic lines (taunts, threats, battle cries, victory lines). 0 = every line, mission
; directions included. Which lines count is the last column of VoiceMenu\VoiceLines.txt.
DramaticOnly=1
; 1 = show the game's speech bubble (the speaker's head and the subtitle) while a line plays.
ShowSpeechBubble=1
; Rate limit: seconds after a line ends before another can start (stopping a line early also starts it).
Cooldown=3.0
; 1 = a new line may cut off the one playing; the cooldown then counts from when the last line started.
AllowInterrupt=0
; Show each line's subtitle text under its name (from the game's text tables, when it has one).
ShowSubtitles=1
; 1 = close the menu when a line starts.
CloseOnPlay=0
FontScale=1.25
ShowStartupNote=1

[Aliases]
; Character name=Speaker, for characters whose name doesn't contain the speaker's name.
; Names are the game's creature names (shown in the menu as "Playing as").
OptimusPrime=Optimus
G1OptimusPrime=Optimus
