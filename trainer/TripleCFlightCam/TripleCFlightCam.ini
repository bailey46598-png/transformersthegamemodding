[TripleCFlightCam]
; Camera for TripleC on foot. Blackout = Blackout's on-foot camera (default), Default = the game's generic camera.
; The heli always uses Blackout's flight camera (that also fixes heli steering, which follows the camera).
RobotCamera=Blackout
; Heli handling. Blackout = Blackout's flight model (TripleC keeps its own gun positions), Default = the game's AI-gunship handling.
FlightModel=Blackout
