; CharacterCams.ini (replaces TripleCFlightCam.ini)

[TripleC]
; On-foot camera. Blackout = Blackout's on-foot camera (default), Default = the game's generic camera.
; The heli always uses Blackout's flight camera (heli steering follows the camera).
RobotCamera=Blackout
; Heli handling. Blackout = Blackout's flight model (keeps TripleC's gun positions), Default = the game's AI-gunship handling.
FlightModel=Blackout

[Bonecrusher]
; Car camera base.
;   Truck     = the game's own big-vehicle camera (also Optimus's, Ironhide's, Brawl's), fixed up for him (default)
;   Bumblebee = Bumblebee's small-car camera, resized (earlier tests: too low, then top-down)
;   Default   = untouched game camera
CarCamera=Truck
; Starting distance behind him. Truck uses 12, Bumblebee 7.5.
CarDistance=12
; Closest the camera may come when he's slow, and how far it may pull out at speed (it blends with speed).
; The truck camera ships with 12 -> -2, so it zoomed IN as he sped up. Bumblebee uses 0.75 -> 20.
CarNearDistance=12
CarFarDistance=14
; Moves the camera itself up or down (not the aim point). Small steps: +0.5 is noticeable, +3 was top-down.
CarHeight=0
; How steeply it looks down, in degrees (17-49). Truck uses 33, cars 22.
CarPitchDegrees=33
; Car handling. Optimus = Optimus's truck physics (mass, body, tyre grip) on his own 6 wheels (default; fixes the hop).
; Default = the game's (very grippy tyres on a light truck: it pitches and hops while driving).
Handling=Default
; Suspension and wheel size (only with Handling=Optimus). 0 = leave as copied from Optimus (default).
; Damping for each wheel: the game's is 0.5. Higher = calmer (2 was tried together with WheelRadius=1).
WheelDamping=0
; Spring strength multiplier. 1 = unchanged. Higher = stiffer.
WheelSpring=1
; Physics wheel radius. 0 = unchanged (0.566). The game also draws the wheels at this size, so 1.0 made them
; far too big in game and upset the steering. Leave at 0.
WheelRadius=0
; Bonecrusher's chase camera fires a collision ray that hits his own body and pins the camera to his back door.
; Hits closer than this (from his centre; his tail is ~4.8) are ignored. Walls further out still work. 0 = off.
IgnoreRayHitsUnder=6
; R (front) view. On = fixed for the Buffalo (default), Off = the game's (camera ends up inside him).
RView=On
; How high and how far in front of his centre the R camera sits. His nose is ~4.8 in front. Optimus uses 1.5 / 9.
RViewHeight=2
RViewForward=10
